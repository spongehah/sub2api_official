# =============================================================================
# Sub2API Nginx Configuration - Distributed Deployment
# =============================================================================
# Load balancer configuration for master-slave cluster mode.
# - HTTP requests: Round-robin to all slaves
# - WebSocket: Sticky session based on client IP (required for WS state)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-ndjson;

    # ==========================================================================
    # Upstream: Sub2API Slaves
    # ==========================================================================
    # For HTTP requests: round-robin load balancing
    upstream sub2api_http {
        least_conn;
        server sub2api-slave:8080;
        # Add more slaves here when scaling:
        # server sub2api-slave-2:8080;
        # server sub2api-slave-3:8080;
        
        keepalive 32;
    }

    # For WebSocket: IP hash for sticky session (required for WS state)
    upstream sub2api_ws {
        ip_hash;
        server sub2api-slave:8080;
        # Add more slaves here when scaling:
        # server sub2api-slave-2:8080;
        # server sub2api-slave-3:8080;
    }

    # ==========================================================================
    # Server Configuration
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # Client request limits
        client_max_body_size 100M;
        client_body_buffer_size 10M;

        # Proxy timeouts (long for streaming responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------------------------------------------------------------------
        # WebSocket endpoints - use ip_hash upstream for sticky session
        # ---------------------------------------------------------------------
        location ~ ^/v1/realtime {
            proxy_pass http://sub2api_ws;
            
            # WebSocket specific settings
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Longer timeouts for WebSocket
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            # Disable buffering for real-time
            proxy_buffering off;
        }

        # ---------------------------------------------------------------------
        # SSE/Streaming endpoints - disable buffering
        # ---------------------------------------------------------------------
        location ~ ^/v1/(chat/completions|completions|responses) {
            proxy_pass http://sub2api_http;
            
            # Streaming settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Disable buffering for streaming
            proxy_buffering off;
            proxy_cache off;
            
            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # ---------------------------------------------------------------------
        # Health check endpoint
        # ---------------------------------------------------------------------
        location /health {
            proxy_pass http://sub2api_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---------------------------------------------------------------------
        # All other requests - standard HTTP load balancing
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://sub2api_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
